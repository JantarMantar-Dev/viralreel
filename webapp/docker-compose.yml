services:
  postgres:
    image: postgres:15
    container_name: webapp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: webapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d webapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - webapp-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: webapp-server
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - ./shared:/shared
      - /app/node_modules
    command: sh -c "npm run db:generate && npm run db:migrate && npm run dev"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - CLIENT_URL=http://localhost:5173
      - DATABASE_URL=postgresql://user:password@postgres:5432/webapp
      - BETTER_AUTH_SECRET=placeholder_secret_replace_me_in_prod_1234567890
      - BETTER_AUTH_URL=http://localhost:3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_TTS_KEY=${GROQ_TTS_KEY}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - webapp-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: webapp-client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
      - VITE_LENDING_URL=${VITE_LENDING_URL:-http://localhost:3001}
    command: npm run dev -- --host
    depends_on:
      - server
    networks:
      - webapp-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    container_name: webapp-worker
    volumes:
      - ./worker:/app
      - ./shared:/shared
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/webapp
      - VIDEO_WORK_DIR=/app/work_dir
      - WORKER_ID=unified-worker-1
      - ESBUILD_BINARY_PATH=/app/node_modules/@esbuild/linux-arm64/bin/esbuild
    env_file: .env
    command: npx tsx watch src/worker.ts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - webapp-network

networks:
  webapp-network:
    driver: bridge

volumes:
  postgres_data:
